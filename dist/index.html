<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Sheep color customization</title>
    <link rel="stylesheet" href="style.css">
</head>
  <body style="
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    bottom: 0;
    display: grid;
    grid-template-columns: 1fr 3fr 1fr;
    grid-template-rows: 1fr 8fr 1fr;
  ">
    <div style="
      grid-column: 2;
      grid-row: 2;
      background: gray;
      overflow: hidden;
    ">
      <img src="images/sheep.jpg" id="sheepImg" style="width: 100%;"/>
      <img src="images/sheep_wool_mask.jpg" id="sheepWoolMask" style="width: 100%; visibility: hidden;"/>
      <img src="images/sheep_skin_mask.jpg" id="sheepSkinMask" style="width: 100%; visibility: hidden;"/>
    </div>
    <div style="
      grid-column: 3;
      grid-row: 2;
    ">
      <div>
        <input type="color" id="woolColorPicker" value="#ffffff"/>
      </div>
      <div>
        <input type="color" id="skinColorPicker" value="#ffffff"/>
      </div>
      <input type="button" id="changeColorButton" value="change color">
    </div>
    <script src="scripts/index.js"></script>
  </body>
</html>
