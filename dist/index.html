<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Acicularis color customization</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width">
</head>
  <body style="
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    bottom: 0;
    overflow: hidden;
    margin: 0;
  ">
    <div id="titleContainer">
      <a id="title" href="https://www.acicularis.com/" target="_blank">Acicularis</a>
      <svg class="external-link" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" x2="21" y1="14" y2="3"/></svg>
    </div>
    <a id="authorLabel" href="https://github.com/ae4a" target="_blank">By AE4</a>
    <div id="mainContainer">
      <img src="images/var1/sheep.jpg" id="sheepImg"/>
    </div>
    <div id="controlsContainerFather">
      <div id="controlsContainer">
        <div class="lineC">
          <h2 class="label">Основа (шерсть):</h2>
          <div id="skinSelect" class="dropdown"></div>
        </div>
        <div class="lineC">
          <h2 class="label">Шубка (ткань):</h2>
          <div id="woolSelect" class="dropdown"></div>
        </div>
      </div>
    </div>
    <div id="console">
    </div>
    <script src="scripts/index.js"></script>
  </body>
</html>
