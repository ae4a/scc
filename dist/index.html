<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Sheep color customization</title>
    <link rel="stylesheet" href="style.css">
</head>
  <body style="
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    bottom: 0;
    overflow: hidden;
    margin: 0;
  ">
    <div style="
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    overflow: hidden;
    margin: 0;
    display: grid;
    align-content: center;
  ">
    <img src="images/sheep.jpg" id="sheepImg" style="width: 100%;"/>
    </div>
    <div style="
      position: absolute;
      z-index: 10;
      top: 0;
      left: 0;
    ">
      <div>
        <input type="color" id="woolColorPicker" value="#ffffff"/>
      </div>
      <div>
        <input type="color" id="skinColorPicker" value="#ffffff"/>
      </div>
      <input type="button" id="changeColorButton" value="change color">
    </div>
    <div style="
      position: absolute;
      z-index: 10;
      top: 20%;
      right: 20%;
    ">
      <h2>New menu:</h2>
      <div id="woolSelect"></div>
    </div>
    
    <script src="scripts/index.js"></script>
  </body>
  <div style="overflow: hidden;">
    </div>
</html>
