<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Sheep color customization</title>
    <link rel="stylesheet" href="style.css">
</head>
  <body style="
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    bottom: 0;
    overflow: hidden;
    margin: 0;
  ">
    <div style="
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      overflow: hidden;
      margin: 0;
      display: grid;
      align-content: center;
    ">
      <img src="images/sheep.jpg" id="sheepImg" style="width: 100%;"/>
    </div>
    <div style="
      position: absolute;
      z-index: 10;
      top: 20%;
      right: 4%;
    ">
      <div style="display: flex; align-items: center;">
        <h2 style="color: var(--light); margin-inline: 10px;">Цвет шерстки:</h2>
        <div id="woolSelect"></div>
      </div>
      <div style="display: flex; align-items: center;">
        <h2 style="color: var(--light); margin-inline: 10px;">Цвет кожи:</h2>
        <div id="skinSelect"></div>
      </div>
    </div>
    <script src="scripts/index.js"></script>
  </body>
</html>
