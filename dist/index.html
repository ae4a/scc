<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Sheep color customization</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width">
</head>
  <body style="
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    bottom: 0;
    overflow: hidden;
    margin: 0;
  ">
    <div id="titleContainer">
      <a id="title" href="https://www.acicularis.com" target="_blank">Acicularis</a>
    </div>
    <a id="authorLabel" href="https://github.com/CGSG-2021-AE4" target="_blank">By AE4</a>
    <div id="mainContainer">
      <img src="images/var1/sheep.jpg" id="sheepImg"/>
    </div>
    <div id="controlsContainerFather">
      <div id="controlsContainer">
        <div class="lineC">
          <h2 class="label">Основа (шерсть):</h2>
          <div id="skinSelect" class="dropdown"></div>
        </div>
        <div class="lineC">
          <h2 class="label">Шубка (ткань):</h2>
          <div id="woolSelect" class="dropdown"></div>
        </div>
      </div>
    </div>
    <div id="console">
    </div>
    <script src="scripts/index.js"></script>
  </body>
</html>
